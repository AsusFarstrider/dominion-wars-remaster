# Dominion Wars modern Windows compatibility profile
EnableDDrawCompat = on
FullscreenMode = borderless
DisplayAspectRatio = app
PalettizedTextures = on
CompatFixes = singlemonitor
CapsPatches = D3DDEVICEDESC.dpcTriCaps.dwTextureCaps|=0x2
ForceD3D9On12 = on
# Private focus experiment: not the packaged compatibility profile.
AltTabFix = noactivateapp(0)
# Isolated resolution experiment; only ResolutionScale varies between runs.
DisplayFilter = bilinear(0)
ResolutionScale = display(-1)
Antialiasing = off
FpsLimiter = off
ResolutionScaleFilter = bilinear
# Private 960x600 logical-mode advertisement; desktop override retained.
DisplayResolution = desktop
SupportedResolutions = native, 640x480, 800x600, 1024x768, 960x600
